<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Document Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink:        #0F1826;
    --panel:      #172439;
    --panel-2:    #1E2E48;
    --hairline:   #2C3C57;
    --parchment:  #EFE7D6;
    --parchment-ink: #1B2333;
    --text:       #E7E3D6;
    --text-muted: #8C96AC;
    --brass:      #C6923F;
    --brass-dim:  #7C6636;
    --error:      #C6603F;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--ink);
    color: var(--text);
    font-family: "Cairo", "Source Serif 4", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- header ---------- */
  header {
    padding: 22px clamp(16px, 4vw, 48px) 18px;
    border-bottom: 1px solid var(--hairline);
    flex-shrink: 0;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
  }

  .brand h1 {
    font-family: "Source Serif 4", serif;
    font-weight: 600;
    font-size: 1.5rem;
    letter-spacing: 0.01em;
    margin: 0;
    color: #F4EFE2;
  }

  .brand p {
    margin: 4px 0 0;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  #reset-btn {
    background: none;
    border: 1px solid var(--hairline);
    color: var(--text-muted);
    font-family: inherit;
    font-size: 0.82rem;
    padding: 7px 14px;
    border-radius: 3px;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.15s, color 0.15s;
  }
  #reset-btn:hover {
    border-color: var(--brass-dim);
    color: var(--brass);
  }

  /* ---------- chat thread ---------- */
  #thread {
    flex: 1;
    overflow-y: auto;
    padding: 28px clamp(16px, 4vw, 48px);
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  #thread::-webkit-scrollbar { width: 8px; }
  #thread::-webkit-scrollbar-thumb { background: var(--panel-2); border-radius: 4px; }

  .empty-state {
    margin: auto;
    max-width: 420px;
    text-align: center;
    color: var(--text-muted);
  }
  .empty-state .mark {
    width: 34px;
    height: 34px;
    margin: 0 auto 16px;
    border: 1px solid var(--brass-dim);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--brass);
    font-family: "Source Serif 4", serif;
    font-size: 1.1rem;
  }
  .empty-state p { font-size: 0.92rem; line-height: 1.6; margin: 0; }

  .row {
    display: flex;
    max-width: 100%;
  }
  .row.user     { justify-content: flex-end; }
  .row.assistant{ justify-content: flex-start; }

  .bubble {
    max-width: min(640px, 82%);
    padding: 13px 17px;
    border-radius: 4px;
    font-size: 0.95rem;
    line-height: 1.65;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .bubble.user {
    background: var(--parchment);
    color: var(--parchment-ink);
    border-inline-end: 3px solid var(--brass);
  }

  .bubble.assistant {
    background: var(--panel);
    border-inline-start: 3px solid var(--brass);
    color: var(--text);
  }

  .bubble.error {
    background: rgba(198, 96, 63, 0.12);
    border-inline-start: 3px solid var(--error);
    color: #E9C6B8;
  }

  /* right-to-left detection swaps which side reads as "the citation margin" */
  .bubble[dir="rtl"].user     { border-inline-end: none; border-inline-start: 3px solid var(--brass); }
  .bubble[dir="rtl"].assistant{ border-inline-start: none; border-inline-end: 3px solid var(--brass); }

  .typing {
    display: inline-flex;
    gap: 5px;
    padding: 4px 2px;
  }
  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: pulse 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-2px); }
  }

  /* ---------- composer ---------- */
  #composer {
    flex-shrink: 0;
    border-top: 1px solid var(--hairline);
    padding: 16px clamp(16px, 4vw, 48px) 20px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  #question {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--hairline);
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    line-height: 1.5;
    padding: 12px 14px;
    border-radius: 4px;
    max-height: 160px;
    outline: none;
    transition: border-color 0.15s;
  }
  #question:focus { border-color: var(--brass-dim); }
  #question::placeholder { color: var(--text-muted); }

  #send-btn {
    background: var(--brass);
    color: #1B140B;
    border: none;
    font-family: inherit;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 12px 20px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }
  #send-btn:hover:not(:disabled) { background: #D6A254; }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  footer {
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-muted);
    padding-bottom: 10px;
    flex-shrink: 0;
  }

  @media (max-width: 560px) {
    header { flex-direction: column; align-items: flex-start; gap: 8px; }
    .bubble { max-width: 92%; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Document Analyzer</h1>
    <p>Retrieval → Analysis → Answer, with sources</p>
  </div>
  <button id="reset-btn" type="button">New conversation</button>
</header>

<div id="thread">
  <div class="empty-state" id="empty-state">
    <div class="mark">?</div>
    <p>Ask a question about your documents to get started. Answers are grounded in the retrieved passages, with sources listed at the end.</p>
  </div>
</div>

<form id="composer">
  <textarea id="question" rows="1" placeholder="Ask about your documents…" autofocus></textarea>
  <button id="send-btn" type="submit">Send</button>
</form>

<footer>Multi-Agent RAG Document Analyzer</footer>

<script>
  const thread = document.getElementById("thread");
  const emptyState = document.getElementById("empty-state");
  const form = document.getElementById("composer");
  const input = document.getElementById("question");
  const sendBtn = document.getElementById("send-btn");
  const resetBtn = document.getElementById("reset-btn");

  const ARABIC_RE = /[\u0600-\u06FF]/;

  function detectDir(text) {
    return ARABIC_RE.test(text) ? "rtl" : "ltr";
  }

  function addMessage(role, text) {
    emptyState.remove();

    const row = document.createElement("div");
    row.className = `row ${role}`;

    const bubble = document.createElement("div");
    bubble.className = `bubble ${role}`;
    bubble.dir = detectDir(text);
    bubble.textContent = text;

    row.appendChild(bubble);
    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
    return bubble;
  }

  function addTypingIndicator() {
    const row = document.createElement("div");
    row.className = "row assistant";
    row.id = "typing-row";

    const bubble = document.createElement("div");
    bubble.className = "bubble assistant";
    bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';

    row.appendChild(bubble);
    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
  }

  function removeTypingIndicator() {
    document.getElementById("typing-row")?.remove();
  }

  async function sendQuestion(question) {
    addMessage("user", question);
    addTypingIndicator();
    sendBtn.disabled = true;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });

      removeTypingIndicator();

      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        addMessage("error", body.detail || `Request failed (${res.status}).`);
        return;
      }

      const data = await res.json();
      addMessage("assistant", data.answer);
    } catch (err) {
      removeTypingIndicator();
      addMessage("error", "Couldn't reach the server. Is it running?");
    } finally {
      sendBtn.disabled = false;
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;
    input.value = "";
    input.style.height = "auto";
    sendQuestion(question);
  });

  // Enter sends, Shift+Enter adds a newline.
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  // Auto-grow the textarea as the person types.
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });

  resetBtn.addEventListener("click", async () => {
    try {
      await fetch("/api/reset", { method: "POST" });
    } catch (_) {
      // even if the server call fails, still clear the visible thread
    }
    thread.innerHTML = "";
    thread.appendChild(emptyState);
    input.focus();
  });
</script>

</body>
</html>
