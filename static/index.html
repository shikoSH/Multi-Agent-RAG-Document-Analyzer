<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Document Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink:        #0F1826;
    --panel:      #172439;
    --panel-2:    #1E2E48;
    --hairline:   #2C3C57;
    --parchment:  #EFE7D6;
    --parchment-ink: #1B2333;
    --text:       #E7E3D6;
    --text-muted: #8C96AC;
    --brass:      #C6923F;
    --brass-dim:  #7C6636;
    --error:      #C6603F;
    --rec:        #D4574A;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--ink);
    color: var(--text);
    font-family: "Cairo", "Source Serif 4", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- header ---------- */
  header {
    padding: 22px clamp(16px, 4vw, 48px) 18px;
    border-bottom: 1px solid var(--hairline);
    flex-shrink: 0;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
  }

  .brand h1 {
    font-family: "Source Serif 4", serif;
    font-weight: 600;
    font-size: 1.5rem;
    letter-spacing: 0.01em;
    margin: 0;
    color: #F4EFE2;
  }

  .brand p {
    margin: 4px 0 0;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  #reset-btn {
    background: none;
    border: 1px solid var(--hairline);
    color: var(--text-muted);
    font-family: inherit;
    font-size: 0.82rem;
    padding: 7px 14px;
    border-radius: 3px;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.15s, color 0.15s;
  }
  #reset-btn:hover {
    border-color: var(--brass-dim);
    color: var(--brass);
  }

  /* ---------- chat thread ---------- */
  #thread {
    flex: 1;
    overflow-y: auto;
    padding: 28px clamp(16px, 4vw, 48px);
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  #thread::-webkit-scrollbar { width: 8px; }
  #thread::-webkit-scrollbar-thumb { background: var(--panel-2); border-radius: 4px; }

  .empty-state {
    margin: auto;
    max-width: 420px;
    text-align: center;
    color: var(--text-muted);
  }
  .empty-state .mark {
    width: 34px;
    height: 34px;
    margin: 0 auto 16px;
    border: 1px solid var(--brass-dim);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--brass);
    font-family: "Source Serif 4", serif;
    font-size: 1.1rem;
  }
  .empty-state p { font-size: 0.92rem; line-height: 1.6; margin: 0; }

  .message-block {
    display: flex;
    flex-direction: column;
    max-width: 100%;
  }
  .message-block.user     { align-items: flex-end; }
  .message-block.assistant{ align-items: flex-start; }

  .bubble {
    max-width: min(640px, 82%);
    padding: 13px 17px;
    border-radius: 4px;
    font-size: 0.95rem;
    line-height: 1.65;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .bubble.user {
    background: var(--parchment);
    color: var(--parchment-ink);
    border-inline-end: 3px solid var(--brass);
  }

  .bubble.assistant {
    background: var(--panel);
    border-inline-start: 3px solid var(--brass);
    color: var(--text);
  }

  .bubble.error {
    background: rgba(198, 96, 63, 0.12);
    border-inline-start: 3px solid var(--error);
    color: #E9C6B8;
  }

  .bubble[dir="rtl"].user     { border-inline-end: none; border-inline-start: 3px solid var(--brass); }
  .bubble[dir="rtl"].assistant{ border-inline-start: none; border-inline-end: 3px solid var(--brass); }

  .report-link {
    margin-top: 6px;
    font-size: 0.78rem;
    color: var(--text-muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 4px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: color 0.15s;
  }
  .report-link:hover { color: var(--brass); }
  .report-link:disabled { opacity: 0.5; cursor: default; }

  .typing {
    display: inline-flex;
    gap: 5px;
    padding: 4px 2px;
  }
  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: pulse 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-2px); }
  }

  /* ---------- composer ---------- */
  #composer {
    flex-shrink: 0;
    border-top: 1px solid var(--hairline);
    padding: 12px clamp(16px, 4vw, 48px) 18px;
  }

  #attachment-preview {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 0.82rem;
    color: var(--text-muted);
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 6px 10px;
    margin-bottom: 8px;
    width: fit-content;
  }
  #attachment-preview.visible { display: flex; }
  #attachment-preview button {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.9rem;
    line-height: 1;
    padding: 0;
  }
  #attachment-preview button:hover { color: var(--error); }

  #composer-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  .icon-btn {
    background: var(--panel);
    border: 1px solid var(--hairline);
    color: var(--text-muted);
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1.05rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .icon-btn:hover { border-color: var(--brass-dim); color: var(--brass); }
  .icon-btn.recording {
    background: rgba(212, 87, 74, 0.15);
    border-color: var(--rec);
    color: var(--rec);
    animation: recpulse 1.2s infinite;
  }
  @keyframes recpulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(212, 87, 74, 0.4); }
    50% { box-shadow: 0 0 0 6px rgba(212, 87, 74, 0); }
  }

  #question {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--hairline);
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    line-height: 1.5;
    padding: 12px 14px;
    border-radius: 4px;
    max-height: 160px;
    outline: none;
    transition: border-color 0.15s;
  }
  #question:focus { border-color: var(--brass-dim); }
  #question::placeholder { color: var(--text-muted); }

  #send-btn {
    background: var(--brass);
    color: #1B140B;
    border: none;
    font-family: inherit;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 0 20px;
    height: 42px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }
  #send-btn:hover:not(:disabled) { background: #D6A254; }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  footer {
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-muted);
    padding-bottom: 10px;
    flex-shrink: 0;
  }

  @media (max-width: 560px) {
    header { flex-direction: column; align-items: flex-start; gap: 8px; }
    .bubble { max-width: 92%; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Document Analyzer</h1>
    <p>Retrieval → Analysis → Answer, with sources</p>
  </div>
  <button id="reset-btn" type="button">New conversation</button>
</header>

<div id="thread">
  <div class="empty-state" id="empty-state">
    <div class="mark">?</div>
    <p>Ask a question about your documents to get started — by typing, by voice, or by uploading a photo of a page. Answers are grounded in the retrieved passages, with sources listed at the end.</p>
  </div>
</div>

<div id="composer">
  <div id="attachment-preview">
    <span id="attachment-label"></span>
    <button id="attachment-clear" type="button" title="Remove">✕</button>
  </div>

  <form id="composer-row">
    <button id="mic-btn" class="icon-btn" type="button" title="Ask by voice">🎤</button>
    <button id="image-btn" class="icon-btn" type="button" title="Upload a photo (OCR)">📎</button>
    <input id="image-input" type="file" accept="image/*" hidden />
    <textarea id="question" rows="1" placeholder="Ask about your documents…" autofocus></textarea>
    <button id="send-btn" type="submit">Send</button>
  </form>
</div>

<footer>Multi-Agent RAG Document Analyzer</footer>

<script>
  const thread = document.getElementById("thread");
  const emptyState = document.getElementById("empty-state");
  const form = document.getElementById("composer-row");
  const input = document.getElementById("question");
  const sendBtn = document.getElementById("send-btn");
  const resetBtn = document.getElementById("reset-btn");
  const micBtn = document.getElementById("mic-btn");
  const imageBtn = document.getElementById("image-btn");
  const imageInput = document.getElementById("image-input");
  const attachmentPreview = document.getElementById("attachment-preview");
  const attachmentLabel = document.getElementById("attachment-label");
  const attachmentClear = document.getElementById("attachment-clear");

  const ARABIC_RE = /[\u0600-\u06FF]/;

  function detectDir(text) {
    return ARABIC_RE.test(text) ? "rtl" : "ltr";
  }

  function clearAttachmentPreview() {
    attachmentPreview.classList.remove("visible");
    attachmentLabel.textContent = "";
  }

  function showAttachmentPreview(label) {
    attachmentLabel.textContent = label;
    attachmentPreview.classList.add("visible");
  }

  function insertIntoQuestion(text) {
    if (!text) return;
    input.value = input.value.trim() ? `${input.value.trim()} ${text}` : text;
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
    input.focus();
  }

  function addUserMessage(text) {
    emptyState.remove();
    const block = document.createElement("div");
    block.className = "message-block user";

    const bubble = document.createElement("div");
    bubble.className = "bubble user";
    bubble.dir = detectDir(text);
    bubble.textContent = text;

    block.appendChild(bubble);
    thread.appendChild(block);
    thread.scrollTop = thread.scrollHeight;
  }

  function addAssistantMessage(text, entryId) {
    emptyState.remove();
    const block = document.createElement("div");
    block.className = "message-block assistant";

    const bubble = document.createElement("div");
    bubble.className = "bubble assistant";
    bubble.dir = detectDir(text);
    bubble.textContent = text;
    block.appendChild(bubble);

    if (entryId != null) {
      const reportBtn = document.createElement("button");
      reportBtn.className = "report-link";
      reportBtn.type = "button";
      reportBtn.textContent = "📄 Download PDF report";
      reportBtn.addEventListener("click", () => downloadReport(entryId, reportBtn));
      block.appendChild(reportBtn);
    }

    thread.appendChild(block);
    thread.scrollTop = thread.scrollHeight;
  }

  function addErrorMessage(text) {
    emptyState.remove();
    const block = document.createElement("div");
    block.className = "message-block assistant";

    const bubble = document.createElement("div");
    bubble.className = "bubble error";
    bubble.textContent = text;
    block.appendChild(bubble);

    thread.appendChild(block);
    thread.scrollTop = thread.scrollHeight;
  }

  function addTypingIndicator() {
    const block = document.createElement("div");
    block.className = "message-block assistant";
    block.id = "typing-row";

    const bubble = document.createElement("div");
    bubble.className = "bubble assistant";
    bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';

    block.appendChild(bubble);
    thread.appendChild(block);
    thread.scrollTop = thread.scrollHeight;
  }

  function removeTypingIndicator() {
    document.getElementById("typing-row")?.remove();
  }

  function downloadReport(entryId, btn) {
    btn.disabled = true;
    const original = btn.textContent;
    btn.textContent = "Building report…";
    // Opening in a new tab triggers the browser's normal PDF download/
    // preview behavior - no extra fetch/blob handling needed.
    window.open(`/api/report/${entryId}`, "_blank");
    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = original;
    }, 1500);
  }

  async function sendQuestion(question) {
    addUserMessage(question);
    addTypingIndicator();
    sendBtn.disabled = true;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });

      removeTypingIndicator();

      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        addErrorMessage(body.detail || `Request failed (${res.status}).`);
        return;
      }

      const data = await res.json();
      addAssistantMessage(data.answer, data.id);
    } catch (err) {
      removeTypingIndicator();
      addErrorMessage("Couldn't reach the server. Is it running?");
    } finally {
      sendBtn.disabled = false;
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;
    input.value = "";
    input.style.height = "auto";
    sendQuestion(question);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });

  resetBtn.addEventListener("click", async () => {
    try {
      await fetch("/api/reset", { method: "POST" });
    } catch (_) {}
    thread.innerHTML = "";
    thread.appendChild(emptyState);
    input.focus();
  });

  // ---------------- Voice query ----------------
  // Uses the browser's own speech recognition (Web Speech API) - free,
  // no API key, no server round-trip. Supported in Chrome/Edge; not in
  // Firefox, which doesn't implement this API.
  // Recognized speech lands in the question box for you to review (and
  // edit) before sending - it never auto-sends.
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isRecording = false;

  if (SpeechRecognitionAPI) {
    recognition = new SpeechRecognitionAPI();
    recognition.lang = "ar-EG";       // change to "en-US" if you mostly ask in English
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      insertIntoQuestion(transcript);
    };

    recognition.onerror = (event) => {
      if (event.error === "not-allowed") {
        addErrorMessage("Microphone access was denied.");
      } else if (event.error !== "no-speech") {
        addErrorMessage(`Voice recognition error: ${event.error}`);
      }
    };

    recognition.onend = () => {
      isRecording = false;
      micBtn.classList.remove("recording");
      micBtn.title = "Ask by voice";
    };
  } else {
    micBtn.disabled = true;
    micBtn.title = "Voice input isn't supported in this browser (try Chrome or Edge)";
  }

  micBtn.addEventListener("click", () => {
    if (!recognition) return;

    if (isRecording) {
      recognition.stop();
      return;
    }

    isRecording = true;
    micBtn.classList.add("recording");
    micBtn.title = "Listening… click to stop";
    recognition.start();
  });

  // ---------------- Image OCR ----------------
  // Lets you upload a photo of a page; the server runs OCR on it and the
  // extracted text lands in the question box, same as voice - review and
  // edit before sending.
  imageBtn.addEventListener("click", () => imageInput.click());

  imageInput.addEventListener("change", async () => {
    const file = imageInput.files[0];
    if (!file) return;

    showAttachmentPreview(`Reading text from ${file.name}…`);

    const formData = new FormData();
    formData.append("image", file);

    try {
      const res = await fetch("/api/ocr", { method: "POST", body: formData });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        addErrorMessage(body.detail || "Couldn't read text from that image.");
        return;
      }
      const data = await res.json();
      if (data.text) {
        insertIntoQuestion(data.text);
        showAttachmentPreview(`Text extracted from ${file.name}`);
      } else {
        showAttachmentPreview(`No text found in ${file.name}`);
      }
    } catch (err) {
      addErrorMessage("Couldn't reach the server to read that image.");
    } finally {
      imageInput.value = "";
    }
  });

  attachmentClear.addEventListener("click", clearAttachmentPreview);
</script>

</body>
</html>
